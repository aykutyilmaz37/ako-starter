<!doctype html>
<!--
  Tüm e-postaların ortak çerçevesi: logo, renkler, alt bilgi. Projeye göre burası özelleştirilir.
  {{alan}}   → değer HTML'e karşı kaçışlanarak yazılır
  {{{alan}}} → değer olduğu gibi yazılır (yalnızca içerik şablonu için: {{{content}}})
  E-posta istemcileri harici CSS'i desteklemez; stiller satır içi (inline) yazılır.
-->
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;overflow:hidden">
            <tr>
              <td style="padding:24px 32px;border-bottom:1px solid #e4e4e7;font-size:18px;font-weight:700">
                {{appName}}
              </td>
            </tr>
            <tr>
              <td style="padding:32px">
                {{{content}}}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px;background:#fafafa;color:#71717a;font-size:12px">
                {{footer}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
