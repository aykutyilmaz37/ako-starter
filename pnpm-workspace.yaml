packages:
  - 'apps/*'
  - 'apps/web/*'
  - 'packages/*'

# Kurulum script'i çalıştırmasına izin verilen paketler (pnpm varsayılan olarak hepsini engeller).
allowBuilds:
  esbuild: true # Orval config dosyasını yüklerken kullanır

minimumReleaseAgeExclude:
  - '@mari-ui/cli@0.3.0 || 0.3.1'
  - '@mari-ui/components@0.3.0 || 0.3.1'
  - '@mari-ui/core@0.3.0 || 0.3.1'
  - '@mari-ui/tokens@0.3.0 || 0.3.1'
  - '@mari-ui/native@0.3.0 || 0.3.1'
  - '@expo/cli@58.1.13'
  - '@expo/metro-config@58.0.15'
  - '@expo/router-server@58.0.15'
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo@58.0.16
  - expo-router@58.0.24
