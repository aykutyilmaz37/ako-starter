# Yerel geliştirme: şimdilik yalnızca Postgres. api ve web servisleri sonra eklenecek.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ako
      POSTGRES_USER: ako
      POSTGRES_PASSWORD: ako
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ako -d ako"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
