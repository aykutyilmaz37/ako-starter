# Yerel geliştirme ortamı.
#   pnpm db:up                          → postgres + mailpit + aspire-dashboard (API'yi kendin "dotnet run" ile çalıştırırsın)
#   docker compose --profile app up -d  → yukarıdakiler + API container'ı (http://localhost:8080)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ako
      POSTGRES_USER: ako
      POSTGRES_PASSWORD: ako
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ako -d ako"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Yerel SMTP: API'nin gönderdiği tüm e-postaları yakalar, hiçbirini dışarı göndermez.
  # Gelen kutusu: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web arayüzü

  # Loglar, trace'ler ve metrikler için yerel arayüz (OpenTelemetry/OTLP alıcısı).
  # Arayüz: http://localhost:18888 — API'nin OTLP adresi: http://localhost:4317
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.0
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured # yalnızca yerel geliştirme için
    ports:
      - "18888:18888" # arayüz
      - "4317:18889"  # OTLP (gRPC)

  # API'nin container sürümü. Yalnızca "--profile app" ile başlar; günlük geliştirmede "dotnet run" kullanılır.
  api:
    profiles: [app]
    build: ./apps/api
    environment:
      ASPNETCORE_ENVIRONMENT: Development # migration + admin hesabı + Swagger
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=ako;Username=ako;Password=ako
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
