# Yerel geliştirme: Postgres + Mailpit. api ve web servisleri sonra eklenecek.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ako
      POSTGRES_USER: ako
      POSTGRES_PASSWORD: ako
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ako -d ako"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Yerel SMTP: API'nin gönderdiği tüm e-postaları yakalar, hiçbirini dışarı göndermez.
  # Gelen kutusu: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web arayüzü

volumes:
  postgres-data:
