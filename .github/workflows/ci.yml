name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm generate:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm run audit

  api:
    name: API build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore apps/api/Ako.slnx
      - run: dotnet format apps/api/Ako.slnx --verify-no-changes --no-restore
      - run: dotnet build apps/api/Ako.slnx -c Release --no-restore
      # Testler Testcontainers/Docker kullanıyorsa runner'da Docker hazırdır.
      - run: dotnet test apps/api/Ako.slnx -c Release --no-build
      - name: Critical açığı olan paket var mı
        run: |
          dotnet list apps/api/Ako.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.log
          ! grep -qE "^\s*>.*\bCritical\b" vuln.log

  e2e:
    name: E2E duman testi
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ako
          POSTGRES_USER: ako
          POSTGRES_PASSWORD: ako
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ako -d ako" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ASPNETCORE_ENVIRONMENT: Development # migration + admin hesabı + örnek ürünler
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ako/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @ako/e2e test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
